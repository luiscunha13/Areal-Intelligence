# ETF Universe Catalog
# Full universe of ~100 ETFs across all categories.
# All price data fetched free via yfinance.
# Adding a new ETF: add an entry here, run catalog_sync. Done.
#
# Fields:
#   ticker:       Yahoo Finance ticker
#   name:         Full fund name
#   category:     sector | factor | fixed_income | international | commodity | real_estate | thematic | volatility | multi_asset
#   sub_category: More specific grouping within category
#   benchmark:    Index the ETF tracks
#   gics_sector:  For sector ETFs only
#   expense_ratio: Annual expense ratio (decimal, e.g. 0.0009 = 0.09%)

