# Macro Series Catalog
# Source of truth for all macroeconomic indicators.
# Adding a new series here is all that's required — the pipeline handles the rest.
#
# Fields:
#   series_id:        FRED series ID (or custom key for derived)
#   name:             Human-readable display name
#   category:         growth | inflation | rates | liquidity | credit | risk | benchmark
#   source:           fred | derived | manual
#   frequency:        daily | weekly | monthly | quarterly
#   unit:             percent | index | billions | millions | thousands | dollars | ratio | binary
#   is_derived:       true if computed from other series
#   derive_formula:   e.g. "WALCL - WTREGEN - RRPONTSYD"
#   display_color:    hex color for charts
#   analysis.rising:  narrative for rising trend
#   analysis.falling: narrative for falling trend

series:

  # ── Growth ────────────────────────────────────────────────────
  - series_id: GDPC1
    name: Real Gross Domestic Product
    category: growth
    source: fred
    frequency: quarterly
    unit: billions
    display_color: "#4ade80"
    analysis:
      rising: "Robust economic expansion drives corporate revenue growth, employment gains, and outperformance in cyclical equity sectors."
      falling: "Slowing growth signals macroeconomic cooling, compressing corporate earnings growth and favoring defensive asset allocation."

  - series_id: INDPRO
    name: Industrial Production Index
    category: growth
    source: fred
    frequency: monthly
    unit: index
    display_color: "#4ade80"

  - series_id: RSAFS
    name: Advance Real Retail Sales
    category: growth
    source: fred
    frequency: monthly
    unit: millions
    display_color: "#4ade80"

  - series_id: UNRATE
    name: Civilian Unemployment Rate
    category: growth
    source: fred
    frequency: monthly
    unit: percent
    display_color: "#f87171"
    analysis:
      rising: "Elevated unemployment signals economic slack, reduced consumer spending capacity, and rising recession risks."
      falling: "Low unemployment indicates tight labor markets, supporting consumer income and economic growth."

  - series_id: PAYEMS
    name: Total Nonfarm Payrolls
    category: growth
    source: fred
    frequency: monthly
    unit: thousands
    display_color: "#4ade80"

  - series_id: ICSA
    name: Initial Jobless Claims
    category: growth
    source: fred
    frequency: weekly
    unit: number
    display_color: "#f87171"

  - series_id: JTSJOL
    name: JOLTS Job Openings
    category: growth
    source: fred
    frequency: monthly
    unit: thousands
    display_color: "#4ade80"

  - series_id: JTSQUR
    name: Quits Rate
    category: growth
    source: fred
    frequency: monthly
    unit: percent
    display_color: "#4ade80"

  - series_id: CES0500000003
    name: Average Hourly Earnings
    category: growth
    source: fred
    frequency: monthly
    unit: dollars
    display_color: "#4ade80"

  - series_id: UMCSENT
    name: Consumer Sentiment
    category: growth
    source: fred
    frequency: monthly
    unit: index
    display_color: "#4ade80"

  - series_id: HOUST
    name: Housing Starts
    category: growth
    source: fred
    frequency: monthly
    unit: thousands
    display_color: "#4ade80"

  - series_id: PERMIT
    name: Building Permits
    category: growth
    source: fred
    frequency: monthly
    unit: thousands
    display_color: "#4ade80"

  - series_id: DGORDER
    name: Durable Goods Orders
    category: growth
    source: fred
    frequency: monthly
    unit: millions
    display_color: "#4ade80"

  - series_id: CSUSHPINSA
    name: Case-Shiller Home Price Index
    category: growth
    source: fred
    frequency: monthly
    unit: index
    display_color: "#4ade80"

  - series_id: GACDFSA066MSFRBPHI
    name: Philly Fed Manufacturing Index
    category: growth
    source: fred
    frequency: monthly
    unit: index
    display_color: "#4ade80"

  - series_id: GACDISA066MSFRBNY
    name: NY Empire State Manufacturing Index
    category: growth
    source: fred
    frequency: monthly
    unit: index
    display_color: "#4ade80"

  - series_id: SAHMREALTIME
    name: Sahm Rule Recession Indicator
    category: growth
    source: fred
    frequency: monthly
    unit: percent
    display_color: "#f87171"
    analysis:
      rising: "Breaching 0.50% confirms a macroeconomic contraction, triggering rapid Fed rate cuts and defensive equity rotation."
      falling: "Remaining below 0.50% signals labor market resilience and low immediate recession probability."

  # ── Inflation ─────────────────────────────────────────────────
  - series_id: CPIAUCSL
    name: Consumer Price Index (CPI)
    category: inflation
    source: fred
    frequency: monthly
    unit: index
    display_color: "#fb923c"
    analysis:
      rising: "Elevated inflation pressures central banks toward hawkish tightening, eroding real purchasing power and weighing on bond prices."
      falling: "Disinflation enables central bank rate cuts, lowering borrowing costs and expanding equity valuation multiples."

  - series_id: CPILFESL
    name: Core CPI
    category: inflation
    source: fred
    frequency: monthly
    unit: index
    display_color: "#fb923c"

  - series_id: PCEPI
    name: PCE Price Index
    category: inflation
    source: fred
    frequency: monthly
    unit: index
    display_color: "#fb923c"

  - series_id: PCEPILFE
    name: Core PCE Price Index
    category: inflation
    source: fred
    frequency: monthly
    unit: index
    display_color: "#fb923c"

  - series_id: PPIFIS
    name: PPI Final Demand
    category: inflation
    source: fred
    frequency: monthly
    unit: index
    display_color: "#fb923c"

  - series_id: T5YIFR
    name: 5Y5Y Forward Inflation Expectation
    category: inflation
    source: fred
    frequency: daily
    unit: percent
    display_color: "#fb923c"

  - series_id: T10YIE
    name: 10-Year Breakeven Inflation Rate
    category: inflation
    source: fred
    frequency: daily
    unit: percent
    display_color: "#fb923c"

  # ── Interest Rates ────────────────────────────────────────────
  - series_id: FEDFUNDS
    name: Federal Funds Effective Rate
    category: rates
    source: fred
    frequency: monthly
    unit: percent
    display_color: "#60a5fa"
    analysis:
      rising: "Higher yields elevate corporate borrowing costs, compress growth stock P/E multiples, and strengthen currency dynamics."
      falling: "Falling yields lower capital costs, expand equity valuation multiples, and support real estate activity."

  - series_id: DGS2
    name: 2-Year Treasury Yield
    category: rates
    source: fred
    frequency: daily
    unit: percent
    display_color: "#60a5fa"

  - series_id: DGS10
    name: 10-Year Treasury Yield
    category: rates
    source: fred
    frequency: daily
    unit: percent
    display_color: "#60a5fa"

  - series_id: DGS30
    name: 30-Year Treasury Yield
    category: rates
    source: fred
    frequency: daily
    unit: percent
    display_color: "#60a5fa"

  - series_id: DFII10
    name: 10-Year Real Yield (TIPS)
    category: rates
    source: fred
    frequency: daily
    unit: percent
    display_color: "#60a5fa"

  - series_id: T10Y2Y
    name: Yield Curve Spread (10Y-2Y)
    category: rates
    source: fred
    frequency: daily
    unit: percent
    display_color: "#a78bfa"
    analysis:
      rising: "Yield curve steepening signals impending macroeconomic adjustment."
      falling: "Yield curve inversion reflects restrictive policy and historically precedes recessions by 12–18 months."

  # ── Liquidity ─────────────────────────────────────────────────
  - series_id: M2SL
    name: M2 Money Supply
    category: liquidity
    source: fred
    frequency: monthly
    unit: billions
    display_color: "#34d399"

  - series_id: WALCL
    name: Fed Total Assets (Balance Sheet)
    category: liquidity
    source: fred
    frequency: weekly
    unit: millions
    display_color: "#34d399"

  - series_id: WTREGEN
    name: Treasury General Account (TGA)
    category: liquidity
    source: fred
    frequency: daily
    unit: millions
    display_color: "#34d399"

  - series_id: RRPONTSYD
    name: Overnight Reverse Repo (ON RRP)
    category: liquidity
    source: fred
    frequency: daily
    unit: billions
    display_color: "#34d399"

  - series_id: FED_NET_LIQUIDITY
    name: Fed Net Liquidity
    category: liquidity
    source: derived
    frequency: weekly
    unit: billions
    is_derived: true
    derive_formula: "WALCL - WTREGEN - RRPONTSYD"
    display_color: "#34d399"
    analysis:
      rising: "Expands bank reserves and market liquidity, fueling equity P/E multiple expansion and credit spread tightening."
      falling: "Drains systemic bank reserves, restricting financial market capacity and elevating market volatility."

  # ── Credit ────────────────────────────────────────────────────
  - series_id: BAMLH0A0HYM2
    name: High Yield Option-Adjusted Spread
    category: credit
    source: fred
    frequency: daily
    unit: percent
    display_color: "#f472b6"
    analysis:
      rising: "Widening spreads signal heightened corporate default risk and tightening credit availability."
      falling: "Tightening spreads indicate healthy credit markets and robust risk appetite."

  - series_id: NFCI
    name: Chicago Fed Financial Conditions Index
    category: credit
    source: fred
    frequency: weekly
    unit: index
    display_color: "#f472b6"

  - series_id: STLFSI4
    name: St. Louis Fed Financial Stress Index
    category: credit
    source: fred
    frequency: weekly
    unit: index
    display_color: "#f472b6"

  # ── Risk ──────────────────────────────────────────────────────
  - series_id: VIXCLS
    name: CBOE Volatility Index (VIX)
    category: risk
    source: fred
    frequency: daily
    unit: index
    display_color: "#f87171"
    analysis:
      rising: "Spiking VIX signals acute equity market fear, risk asset liquidations, and demand for portfolio hedging."
      falling: "Subdued VIX reflects market calm and stable bull market regime conditions."

  - series_id: DCOILWTICO
    name: WTI Crude Oil Price
    category: risk
    source: fred
    frequency: daily
    unit: dollars
    display_color: "#fbbf24"

  - series_id: PCOPPUSDM
    name: Global Copper Price
    category: risk
    source: fred
    frequency: monthly
    unit: dollars
    display_color: "#fbbf24"

  - series_id: COPPER_GOLD
    name: Copper / Gold Ratio
    category: risk
    source: derived
    frequency: monthly
    unit: ratio
    is_derived: true
    derive_formula: "PCOPPUSDM / IQ12260"
    display_color: "#fbbf24"
    analysis:
      rising: "Signals economic expansion, rising global industrial activity, and outperformance of cyclical equities."
      falling: "Indicates slowing industrial growth or stagflation fears."

