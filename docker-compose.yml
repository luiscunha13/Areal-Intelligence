version: "3.9"

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.2
  environment:
    &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    # Pass app env vars into Airflow workers
    FRED_API_KEY: ${FRED_API_KEY}
    DATABASE_URL: postgresql://postgres:postgres@postgres:5432/arealdb
    PYTHONPATH: /opt/airflow/src
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./catalog:/opt/airflow/catalog
    - ./ingestion:/opt/airflow/src/ingestion
    - ./transformation:/opt/airflow/src/transformation
    - ./scoring:/opt/airflow/src/scoring
    - ./catalog:/opt/airflow/src/catalog
    - ./scripts:/opt/airflow/src/scripts
  depends_on:
    postgres:
      condition: service_healthy

services:
  # ─── Database ────────────────────────────────────────────────
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: areal_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: arealdb,airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sh:/docker-entrypoint-initdb.d/init_db.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      retries: 5
      start_period: 10s

  # ─── Airflow ─────────────────────────────────────────────────
  airflow-init:
    <<: *airflow-common
    container_name: areal_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        pip install -q psycopg2-binary pandas yfinance fredapi requests pyyaml sqlalchemy alembic dbt-postgres
        airflow db upgrade
        airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@arealint.com
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: areal_airflow_webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: areal_airflow_scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ─── API ──────────────────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: areal_api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/arealdb
      FRED_API_KEY: ${FRED_API_KEY}
      PYTHON_ENV: development
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: python -m uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  # ─── Frontend ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: areal_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api


volumes:
  postgres_data:
