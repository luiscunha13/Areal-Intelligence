name: areal_intelligence
version: "1.0.0"
config-version: 2

profile: areal_intelligence

model-paths: ["models"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  areal_intelligence:
    staging:
      +materialized: view          # lightweight — just clean + cast raw data
      +schema: staging
    intermediate:
      +materialized: table         # computed features — heavier, worth caching
      +schema: intermediate
    marts:
      +materialized: table
      macro:
        +schema: marts
      sectors:
        +schema: marts
      etfs:
        +schema: marts
      stocks:
        +schema: marts

vars:
  # How far back to compute features (override with --vars)
  lookback_years: 5
