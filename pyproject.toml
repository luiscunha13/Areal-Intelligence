[project]
name = "areal-intelligence"
version = "2.0.0"
description = "Automated financial intelligence platform"
requires-python = ">=3.11"

[project.dependencies]
# Core
fastapi = ">=0.111"
uvicorn = {extras = ["standard"], version = ">=0.29"}
sqlalchemy = ">=2.0"
alembic = ">=1.13"
psycopg2-binary = ">=2.9"
pydantic = ">=2.0"
pydantic-settings = ">=2.0"

# Data fetching
fredapi = ">=0.5"
yfinance = ">=0.2"
httpx = ">=0.27"
requests = ">=2.31"

# Data processing
pandas = ">=2.0"
numpy = ">=1.26"

# Config / utilities
pyyaml = ">=6.0"
python-dotenv = ">=1.0"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
